name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: [17, 21]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Unit and integration tests
        run: mvn -B -ntp verify

  # The declared requiredMavenVersion. Maven 3.9.0 cannot run aggregator goals without a POM
  # (MavenProject.getCollectedProjects() is null), so the floor is 3.9.1.
  maven-floor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Install Maven 3.9.1
        run: |
          curl -fsSL -o maven.zip https://archive.apache.org/dist/maven/maven-3/3.9.1/binaries/apache-maven-3.9.1-bin.zip
          unzip -q maven.zip -d "$RUNNER_TEMP"

      - name: Unit and integration tests on Maven 3.9.1
        run: '"$RUNNER_TEMP/apache-maven-3.9.1/bin/mvn" -B -ntp verify'

  # Early warning only: Maven 4 is a release candidate.
  maven-4:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Install Maven 4.0.0-rc-6
        run: |
          curl -fsSL -o maven.zip https://archive.apache.org/dist/maven/maven-4/4.0.0-rc-6/binaries/apache-maven-4.0.0-rc-6-bin.zip
          unzip -q maven.zip -d "$RUNNER_TEMP"

      - name: Unit and integration tests on Maven 4.0.0-rc-6
        run: '"$RUNNER_TEMP/apache-maven-4.0.0-rc-6/bin/mvn" -B -ntp verify'

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [plugin, maven-floor]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Set the version from the tag
        run: mvn -B -ntp org.codehaus.mojo:versions-maven-plugin:2.22.0:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false

      - name: Build the plugin, sources and javadoc
        run: mvn -B -ntp package source:jar-no-fork javadoc:jar -DskipTests -Dinvoker.skip

      - name: Collect release files
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir dist
          cp "target/ex-maven-plugin-$version.jar" "target/ex-maven-plugin-$version-sources.jar" \
             "target/ex-maven-plugin-$version-javadoc.jar" dist/
          cp pom.xml "dist/ex-maven-plugin-$version.pom"

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v3
        with:
          prerelease: true
          files: dist/*
